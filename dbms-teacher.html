<script>
/* ============================================================
   Как пользоваться
   1) На компьютере откройте урок dbms.html в одной вкладке (её — на проектор),
      а эту страницу — в другой вкладке или окне того же браузера (её — на свой экран).
      Страницы свяжутся сами: здесь будет видно текущий слайд,
      а кнопки «Назад / Далее» будут листать презентацию.
   2) На телефоне или в распечатке страница работает как обычный сценарий:
      листайте слайды кнопками или откройте «Весь сценарий».
   ============================================================ */
const PLAN=39;
const S=[
{st:"Оргмомент",t:1,title:"Приветствие",
 say:`<p>Ассаляму аляйкум, ребята! Садитесь. Начнём, как всегда, с дуа: <b>«Рабби зидни ‘ильман»</b> — «Господи, приумножь мои знания».</p>
<p>Сегодня мы познакомимся с программой, без которой не работает ни один сайт и ни одно приложение в ваших телефонах.</p>`,
 notes:"Проверить, у всех ли есть тетради. Тема пока не называется — её выведем на 3-м слайде."},

{st:"Актуализация",t:2,title:"Вспомним прошлый урок",
 say:`<p>На прошлом уроке мы говорили о базах данных. Проверим, что запомнилось. Я начинаю фразу — вы заканчиваете.</p>
<p><i>(Читаете начало фразы, ждёте ответ, потом кликом открываете правильный.)</i></p>`,
 qa:["База данных — это… → <b>набор данных о предметной области, в котором удобно искать</b>","Строка — <b>запись</b>, столбец — <b>поле</b>","Ключ — это поле, где… → <b>значения не повторяются</b>","Таблицы связывают через… → <b>ключ (код)</b>","Виды БД → <b>иерархические, сетевые, реляционные</b>"],
 notes:"Если путаются — вспомнить базу магазина: «Товары», «Магазины», «Движение товаров», и как связаны артикулом."},

{st:"Мотивация",t:2,title:"Кто всё это делает?",
 say:`<p>Вспомните: на прошлом уроке мы <b>сами</b> искали ответ в шестнадцати строках. Справились.</p>
<p>А теперь представьте маркетплейс. Там миллионы товаров, и прямо сейчас, в эту секунду, тысячи людей что-то ищут, покупают, платят. Человек с фильтрами тут не справится.</p>
<p><i>(Клик.)</i> И ещё вспомните практическую работу. Вы пытались добавить ученика с ключом У3 — и база не дала. Пытались записать в кружок ученика У9, которого нет, — тоже не дала. <b>Кто за этим следил?</b> Не я и не вы.</p>
<p><i>(Выслушать версии. Клик.)</i> Это делает специальная программа — <b>система управления базами данных</b>, коротко <b>СУБД</b>.</p>`,
 qa:["Кто следил, чтобы ключ не повторялся? → <b>программа — СУБД</b>"],
 notes:"Если ученики не делали практическую — опустить второй абзац, оставить пример с маркетплейсом."},

{st:"Тема и цель",t:2,title:"Тема и план",
 say:`<p>Запишите тему: <b>«Системы управления базами данных»</b>.</p>
<p>План у нас такой: узнаем, что такое СУБД и какие они бывают; разберёмся, чем СУБД отличается от электронных таблиц — Excel вы все знаете; что умеет СУБД; поговорим о языке запросов SQL — у него интересная история. А в конце решим задание 3 из ЕГЭ — уже посложнее, чем в прошлый раз.</p>`,
 notes:"Тему — на доску. В конце урока вернуться к плану на рефлексии."},

{st:"Новое знание",t:1.5,title:"Что такое СУБД",
 say:`<p>Посмотрите на схему. Есть <b>пользователь</b> — тот, кто задаёт вопрос. Есть <b>база данных</b> — сами данные. А между ними — <b>СУБД</b>, программа. Пользователь никогда не лезет в данные напрямую: он просит СУБД, а она находит, записывает, исправляет.</p>
<p><i>(Клик — определение.)</i> Запишите: <b>СУБД — программа, которая позволяет создавать базу данных, хранить в ней данные, изменять их и искать нужное.</b></p>
<p><i>(Клик.)</i> Проще всего представить библиотеку. Книги на полках — это база данных. А библиотекарь — это СУБД. Сами книги ничего не умеют. Библиотекарь принимает новые книги, расставляет их по местам, находит нужную по вашей просьбе и не выдаст книгу тому, у кого нет читательского билета.</p>`,
 qa:["Что здесь база данных, а что СУБД? → <b>книги — база, библиотекарь — СУБД</b>"],
 notes:"Определение — обязательно в тетрадь."},

{st:"Новое знание",t:1.5,title:"Какие бывают СУБД",
 say:`<p>СУБД бывают разные. <b>Microsoft Access</b> и бесплатная <b>LibreOffice Base</b> работают на одном компьютере — их часто изучают в школе.</p>
<p>А вот <b>SQLite</b> есть у каждого из вас в кармане. Контакты, переписка, настройки в телефоне — всё это хранится в маленьких базах SQLite.</p>
<p><b>MySQL</b> и <b>PostgreSQL</b> работают на серверах — на них держатся сайты, интернет-магазины, соцсети. Есть и российские СУБД — например, <b>Postgres Pro</b> и <b>Ред База Данных</b>.</p>
<p>И запомните главное: <b>база данных — это данные, а СУБД — программа</b> для работы с ними.</p>`,
 qa:["Где в вашем телефоне может быть база данных? → <b>контакты, сообщения, галерея, будильники, история браузера</b>"],
 notes:"Названия СУБД наизусть учить не нужно — достаточно понимать, что их много и они разные."},

{st:"Новое знание",t:2,title:"Электронная таблица или СУБД?",
 say:`<p>Многие спрашивают: зачем нужна СУБД, если есть электронные таблицы — Excel, LibreOffice Calc? Там тоже таблицы, фильтры, сортировка. Давайте сравним.</p>
<p><b>Для чего.</b> Электронная таблица — чтобы считать: формулы, графики. СУБД — чтобы хранить и искать много связанных данных.</p>
<p><i>(Клик.)</i> <b>Объём.</b> На одном листе Excel — чуть больше миллиона строк, ровно 1 048 576, в LibreOffice Calc сейчас столько же. Кажется, много? А в базах больших магазинов и банков — миллионы и миллиарды записей.</p>
<p><i>(Клик.)</i> <b>Сколько людей сразу.</b> С файлом таблицы обычно работает один человек, в онлайн-таблицах — несколько. С базой маркетплейса — тысячи одновременно.</p>
<p><i>(Клик.)</i> <b>Порядок.</b> В электронной таблице в столбец «Цена» можно написать слово «дорого» — и он не возразит. А СУБД не даст: поле числовое. И ключ повторить не даст.</p>
<p><i>(Клик.)</i> <b>Связи.</b> В электронной таблице листы друг о друге не знают, фильтры мы ставим руками. В СУБД таблицы связаны по ключу, а искать можно запросами.</p>
<p><i>(Клик.)</i> Итог: электронная таблица — это <b>калькулятор и черновик</b>. СУБД — <b>склад с охраной</b>.</p>`,
 qa:["Можно ли в электронной таблице в столбец «Цена» написать «дорого»? → <b>да</b>. А в СУБД? → <b>нет, поле числовое</b>"],
 notes:"Число 1 048 576 — это 2 в 20-й степени: можно спросить, узнают ли они его (связь с темой «Информация»)."},

{st:"Новое знание",t:1.5,title:"Что выбрать: таблицу или СУБД?",
 say:`<p>Теперь потренируемся. Я читаю ситуацию — вы решаете: хватит электронной таблицы или нужна СУБД? Поднимите руку — кто за таблицу? Кто за СУБД?</p>
<p><i>(После голосования — клик по карточке.)</i></p>
<p><i>(Последний клик.)</i> Кстати, на ЕГЭ задание 3 решают как раз в электронной таблице: дают файл .ods, открывают его в LibreOffice Calc и работают фильтрами и формулами. Для пары тысяч строк этого хватает. А вот база маркетплейса в таблицу просто не поместится.</p>`,
 qa:["Бюджет поездки → <b>таблица</b> (нужны расчёты)","Пассажиры и билеты поездов страны → <b>СУБД</b>","Мои оценки и график → <b>таблица</b>","Интернет-магазин → <b>СУБД</b>","Список гостей → <b>таблица</b>","Дневник всей школы → <b>СУБД</b> (много людей, связанные данные, права доступа)"],
 notes:"Споры полезны. Правило для класса: если данных много, они связаны и с ними работает много людей — нужна СУБД."},

{st:"Новое знание",t:1.5,title:"Что умеет СУБД",
 say:`<p>Что же умеет СУБД? Пять вещей.</p>
<p><b>Создаёт</b> — таблицы, поля, связи. <b>Изменяет</b> — добавляет, исправляет и удаляет записи. <b>Ищет</b> — сортирует и отбирает по запросу. <b>Следит за порядком</b> — чтобы ключи не повторялись, связи не рвались. И <b>защищает</b> — пароли, права доступа, резервные копии.</p>
<p><i>(Клик.)</i> Ситуации: какая функция сработала?</p>`,
 qa:["Почта уже занята → <b>следит за порядком</b>","Учитель видит только свои классы → <b>защищает</b>","Новый товар на сайте → <b>изменяет (добавляет)</b>","Товары дешевле 100 ₽ → <b>ищет (запрос)</b>"]},

{st:"Новое знание",t:3,title:"Что делает СУБД, когда ты…",
 say:`<p>Давайте посмотрим, как СУБД работает в жизни — в тех приложениях, которыми вы пользуетесь каждый день. Выберем ситуацию. <i>(Нажимаете на ситуацию, затем «Дальше» — шаги появляются по одному. Стрелка или кликер тоже работают.)</i></p>
<p>Например, маркетплейс. Вы пишете в поиске «кроссовки» — СУБД за долю секунды <b>ищет</b> среди миллионов товаров. Нажимаете «сначала дешёвые» — она <b>сортирует</b>. Оплатили — она <b>изменяет</b> данные: добавляет заказ и уменьшает остаток на складе. А если последнюю пару в ту же секунду покупает кто-то ещё — СУБД <b>следит за порядком</b> и продаст её только одному.</p>
<p><i>(Последний шаг.)</i> А что было бы без СУБД? Одну пару продали бы двоим.</p>
<p>Теперь вы: выберите ситуацию — я покажу, а вы скажете, какую функцию выполняет СУБД на каждом шаге.</p>`,
 qa:["Перед каждым шагом спрашивайте: «Что сейчас делает СУБД — ищет, изменяет, следит за порядком или защищает?» Ответ — на цветной метке справа","Дневник: мама видит только своего ребёнка → <b>защищает</b>","Поезд: место 15 уже занято → <b>следит за порядком</b>","Банк: списать и зачислить — обе операции или ни одной → <b>следит за порядком</b>","Такси: «свободна И ближе 3 км» → <b>ищет</b> (запрос с условием И)"],
 notes:"Все шесть ситуаций разбирать не нужно: 2–3 вместе с классом, остальные — если ученики сами попросят. Лучше брать то, чем пользуются именно ваши ученики (дневник, контакты, маркетплейс). Пример с банком — первое знакомство с идеей «всё или ничего»; термин «транзакция» можно назвать, но не требовать.",
 skip:"Разобрать одну ситуацию — маркетплейс — и сразу перейти дальше."},

{st:"Новое знание",t:1,title:"Из чего состоит база в СУБД",
 say:`<p>Если открыть Access или LibreOffice Base, вы увидите четыре вида объектов. <b>Таблицы</b> — там хранятся данные. <b>Формы</b> — удобные окошки для ввода. <b>Запросы</b> — вопросы к базе. <b>Отчёты</b> — красиво оформленные итоги для печати.</p>
<p>Главное для нас — таблицы и запросы.</p>`,
 skip:"Если не успеваете — этот слайд можно показать за 20 секунд или пропустить."},

{st:"Новое знание",t:2,title:"Типы полей",
 say:`<p>Когда СУБД создаёт поле, она обязательно спрашивает: <b>какие данные в нём будут?</b> Это называется тип поля. Давайте угадаем.</p>
<p><i>(По каждой карточке: «Какой тип?» — голосуют — клик.)</i></p>
<p>Внимание на телефон! Там одни цифры — почему же тип <b>текстовый</b>? Потому что с номером телефона не считают: никто не складывает два телефона. И в нём есть плюс и дефисы.</p>
<p><i>(Клик.)</i> От типа зависит, что можно делать: числа — складывать и сравнивать, даты — искать «раньше» и «позже», текст — искать по совпадению.</p>`,
 qa:["Молоко 2,5% → <b>текстовый</b>","89 → <b>числовой</b>","10.06.2026 → <b>дата</b>","да → <b>логический</b>","+7 913… → <b>текстовый</b>","125 → <b>числовой</b>"]},

{st:"Физминутка",t:2,title:"Живая сортировка",
 say:`<p>Встряхнёмся! Мне нужны шесть добровольцев к доске. Вы — записи в таблице, а весь класс — СУБД, которая проверяет порядок.</p>
<p><i>(Клик.)</i> Встаньте в ряд по месяцу рождения — по возрастанию: от января к декабрю. Класс, проверяйте!</p>
<p><i>(Клик.)</i> Теперь по имени — по алфавиту, от А до Я.</p>
<p><i>(Клик.)</i> А теперь наоборот — от Я до А. Это сортировка по убыванию.</p>
<p><i>(Клик.)</i> Так СУБД сортирует записи. Спасибо, садитесь!</p>`,
 notes:"Подсказать, что команда на экране — настоящая команда SQL: ORDER BY — «упорядочить по», ASC — по возрастанию, DESC — по убыванию."},

{st:"Новое знание",t:2,title:"Запросы: как спросить у СУБД",
 say:`<p>Запрос — это вопрос к базе. СУБД умеет две главные вещи. <b>Сортировать</b> — по возрастанию или по убыванию, как вы только что. И <b>отбирать</b> по условию.</p>
<p><i>(Клик.)</i> В условии используют знаки сравнения: равно, не равно, больше, меньше. И два важных слова. <b>И</b> — нужны оба условия сразу. <b>ИЛИ</b> — хватит любого.</p>
<p>Пример: «девочки И из 11 А» — только девочки нашего класса. «Девочки ИЛИ из 11 А» — все девочки школы плюс все наши мальчики. Чувствуете разницу?</p>
<p><i>(Клик.)</i> А программисты разговаривают с СУБД на специальном языке — <b>SQL</b>. Посмотрите: SELECT — выбрать, FROM — из таблицы, WHERE — где, ORDER BY — отсортировать по. Почти английская фраза.</p>`,
 qa:["Чем отличается И от ИЛИ? → <b>И — оба условия, ИЛИ — хотя бы одно</b>"]},

{st:"Новое знание",t:2,title:"Как появился SQL",
 say:`<p>У этого языка интересная история.</p>
<p><i>(Клик.)</i> <b>1970 год.</b> Математик <b>Эдгар Кодд</b>, работавший в IBM, предложил хранить данные в связанных таблицах. Это та самая реляционная модель, которую мы проходили.</p>
<p><i>(Клик.)</i> <b>1974.</b> Двое его коллег, <b>Дональд Чемберлин</b> и <b>Рэймонд Бойс</b>, придумали язык, на котором можно спрашивать базу почти обычными английскими фразами. Назвали его SEQUEL.</p>
<p><i>(Клик.)</i> <b>1979.</b> Появилась первая СУБД с SQL, которую можно было купить. Её выпустила небольшая компания — сегодня это гигант Oracle.</p>
<p><i>(Клик.)</i> <b>1986.</b> SQL стал официальным стандартом — его понимают почти все реляционные СУБД.</p>
<p><i>(Клики по фактам.)</i> Интересно, что Кодд до науки был военным лётчиком во Вторую мировую. Название SEQUEL пришлось сократить до SQL — такое имя уже было занято другой компанией. Поэтому до сих пор говорят и «эс-кью-эль», и «сиквел» — правильно и так, и так. И главное: этому языку больше пятидесяти лет — он старше ваших родителей, — а программисты пишут на нём каждый день.</p>`,
 qa:["Как думаете, почему SQL до сих пор не устарел? → <b>простой, похож на обычную речь, стандарт для всех СУБД</b>"],
 notes:"Годы наизусть учить не нужно. Главное запомнить: SQL — язык запросов к базам данных, ему больше 50 лет."},

{st:"Новое знание",t:2,title:"SQL умеет не только искать",
 say:`<p>SQL умеет не только искать. Вспомните функции СУБД: создавать, изменять, искать. Для каждой есть команда. <b>SELECT</b> — найти и показать. <b>INSERT</b> — добавить запись. <b>UPDATE</b> — изменить. <b>DELETE</b> — удалить.</p>
<p>Посмотрите пример: «UPDATE Товары SET Цена = 95 WHERE Код = 1» — изменить в товарах цену на 95 там, где код равен единице.</p>
<p><i>(Клик.)</i> А вот самая страшная команда программиста: DELETE без WHERE. Она удалит <b>всю</b> таблицу. Поэтому СУБД и делает резервные копии.</p>
<p><i>(Клик.)</i> А вот как задание 3 ЕГЭ выглядело бы на SQL: <b>одна команда</b>. SUM — сложить, IN — одно из списка. Настоящая СУБД выполнит её за долю секунды.</p><p>Но важно: <b>на экзамене SQL не нужен</b>. Там дают электронную таблицу — файл .ods, открываем его в LibreOffice Calc и решаем фильтрами, как мы с вами. SQL можно подключить только через Python, это для тех, кто хорошо программирует. Нам этот пример нужен, чтобы понять, <b>что делает СУБД</b>, когда мы ставим фильтры.</p>
<p><i>(Клик.)</i> Попробуйте перевести на русский: SELECT звёздочка FROM Ученики WHERE Класс = «11 А».</p>`,
 qa:["SELECT * FROM Ученики WHERE Класс = '11 А' → <b>показать всех учеников 11 А</b>"],
 notes:"На ЕГЭ 2026 к заданию 3 прикладывают файл .ods (LibreOffice Calc / Р7-Офис). Решения через SQL возможны только в Python с модулем sqlite3 — для сильных учеников, слабому классу это не нужно.",
 skip:"Если не успеваете — оставить только «четыре команды» и «ЕГЭ на SQL» с оговоркой про экзамен, про DELETE сказать одной фразой."},

{st:"Закрепление",t:3,title:"Конструктор запросов",
 say:`<p>Теперь сами попробуем побыть СУБД. Это конструктор запросов. Выбираете поле, знак и значение — и результат появляется сразу. А внизу — тот же запрос на языке SQL.</p>
<p><i>(Вызываете учеников по одному на задания 1–4.)</i></p>`,
 qa:["1. Молочных товаров → <b>5</b> (Отдел = Молочный)","2. Дешевле 90 ₽ → <b>6</b> (Цена < 90)","3. Молочный И Акция = да, сортировка по цене → <b>молоко</b>","⭐ Годен до < 09.06.2026 → <b>3</b>"],
 notes:"В задании 3 обратить внимание: сначала два условия через И, потом сортировка — в SQL появится AND и ORDER BY."},

{st:"Закрепление",t:1.5,title:"ЕГЭ: новые ловушки",
 say:`<p>Возвращаемся к заданию 3 ЕГЭ. База та же — сеть магазинов, но теперь за целую неделю, 219 строк. И новые ловушки.</p>
<p><i>(Клик.)</i> <b>Период.</b> «С 2 по 4 июня» — это три дня, а не два. Отмечаем все.</p>
<p><i>(Клик.)</i> <b>Литры и килограммы.</b> Спрашивают не упаковки, а килограммы — умножаем на вес упаковки. 900 граммов — это 0,9 кг.</p>
<p><i>(Клик.)</i> <b>Целый отдел.</b> В отделе несколько товаров — нужны все артикулы.</p>
<p><i>(Клик.)</i> <b>Выручка.</b> Упаковки умножаем на цену.</p>
<p><i>(Клик.)</i> Алгоритм тот же, только добавился пятый шаг — пересчитать.</p>`},

{st:"Закрепление",t:4.5,title:"ЕГЭ у доски",
 say:`<p>Сначала разберём пример вместе. <i>(Кнопка «Показать в таблице» сама ставит фильтры.)</i> Гречка — артикул 5, упаковка 900 граммов. Центральный район — магазины М1 и М2. Даты — второе, третье, четвёртое. Тип — продажа. Сумма — 36 упаковок. Умножаем на 0,9 — получаем 32,4 килограмма.</p>
<p>Теперь сами. <i>(Ученики у доски.)</i></p>`,
 qa:["Пример: гречка, Центральный, 02–04.06 → 36 упак. × 0,9 = <b>32,4 кг</b>","1. Кефир, все магазины, 03.06 → 22 × 0,9 = <b>19,8 л</b>","2. Творог, М5, неделя → 29 × 135 = <b>3915 руб.</b>","⭐ Хлебный отдел (7 и 8), М5 и М6, 05–07.06 → <b>45</b>"],
 notes:"Самая частая ошибка — забыть одну из дат или один из магазинов района. Просите проговаривать вслух каждый фильтр."},

{st:"Самопроверка",t:2,title:"Верно или неверно?",
 say:`<p>Быстрая проверка. Я читаю утверждение — поднимите руку, если считаете, что это верно.</p>`,
 qa:["1. СУБД и база — одно и то же → <b>неверно</b>","2. Телефон — в числовом поле → <b>неверно, в текстовом</b>","3. «Цена < 100 И Отдел = Молочный» → <b>верно</b>","4. По убыванию первым — самое большое → <b>верно</b>","5. «С 03.06 по 05.06» — два дня → <b>неверно, три</b>","6. Интернет-магазин — в электронной таблице → <b>неверно, нужна СУБД</b>"]},

{st:"Самопроверка",t:0,title:"Практикум (если осталось время)",
 say:`<p>У нас осталось время — откройте на телефонах ссылку на практикум. У каждого свой вариант — я его назову. Когда закончите, нажмите кнопку внизу — ответы придут мне в сообщения.</p><p>Кто решит все пять заданий — внизу есть бонус: то же самое, но формулами, как в LibreOffice Calc. Это пригодится на экзамене.</p>`,
 notes:"Ссылку на db-ege3-2.html заранее положить в Umaclass. Номера вариантов раздать по рядам: 1, 2, 3, 4. По времени: слабым хватит разбора и 2–3 заданий, сильные решат всё минут за 8–10 — для них бонус «Функции электронной таблицы» (5 формул: СУММ, СЧЁТЕСЛИ, СУММЕСЛИ, СУММЕСЛИМН, разность). Бонус тоже попадает в сообщение вам. Ответы бонуса: 310, 8, 220, 48, 130.",
 skip:"Нет времени — пропустить этот слайд, практикум дать как дополнительное задание."},

{st:"Рефлексия",t:2,title:"Продолжите фразу",
 say:`<p>Подведём итог. Каждый продолжает одну фразу. <i>(Спрашиваете 4–5 человек.)</i></p>
<p>Давайте вернёмся к плану. Мы узнали, что такое СУБД, чем она отличается от электронных таблиц, что она умеет, познакомились с SQL и решили задание ЕГЭ. Всё выполнили!</p>`,
 notes:"Обратить внимание на того, кто скажет «самым трудным было…» — с этим можно поработать на следующем уроке."},

{st:"Домашнее задание",t:1,title:"Домашнее задание",
 say:`<p>Домашнее задание — на сайте урока, ссылка будет в Umaclass. Два задания: определить типы полей и составить три запроса к базе фильмов в конструкторе. Это минут пятнадцать. В конце нажмите «Скопировать ответ» и вставьте в Umaclass.</p>
<p>Спасибо за урок!</p>`,
 notes:"Ссылка для Umaclass: адрес урока с #dz в конце (…/dbms.html#dz)."}
];

/* ===== отрисовка ===== */
const $=s=>document.querySelector(s);
let view=0,linked=false,deckN=0,total=S.length;
function blocks(x){
  let h=`<div class="blk say"><h3>🗣 Что сказать</h3>${x.say}</div>`;
  if(x.qa)h+=`<div class="blk qa"><h3>❓ Вопросы и ответы</h3><ul>${x.qa.map(q=>`<li>${q}</li>`).join("")}</ul></div>`;
  if(x.notes)h+=`<div class="blk nt"><h3>💡 Заметка</h3><p>${x.notes}</p></div>`;
  if(x.skip)h+=`<div class="blk sk"><h3>⏩ Если не успеваем</h3><p>${x.skip}</p></div>`;
  return h;
}
function drawCur(){
  const x=S[view];
  $("#cur").innerHTML=`<div class="meta"><span class="tag n">Слайд ${view+1} / ${total}</span><span class="tag">${x.st}</span>${x.t?`<span class="tag t">≈ ${String(x.t).replace(".",",")} мин</span>`:`<span class="tag t">по времени</span>`}</div><h2>${x.title}</h2>${blocks(x)}`;
  document.querySelectorAll(".all details").forEach((d,i)=>d.classList.toggle("here",i===view));
}
function drawAll(){
  $("#all").innerHTML=S.map((x,i)=>`<details><summary><span class="no">${i+1}</span>${x.title}<span class="tm">${x.st}${x.t?" · "+String(x.t).replace(".",",")+" мин":""}</span></summary><div class="body">${blocks(x)}<button class="hb noprint" data-go="${i}" type="button">Открыть этот слайд</button></div></details>`).join("");
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const i=+b.dataset.go;if(linked)send({cmd:"go",n:i+1});view=i;drawCur();scrollTo({top:0,behavior:"smooth"});});
}
/* ===== связь с презентацией ===== */
let bc=null;try{bc=new BroadcastChannel("dbms-lesson-11");}catch(e){}
function send(m){if(bc)try{bc.postMessage(m);}catch(e){}}
function setConn(){const c=$("#conn");c.classList.toggle("on",linked);c.textContent=linked?`🔗 презентация: слайд ${deckN}`:"презентация не подключена";
  $("#hint").textContent=linked?"Кнопки «Назад / Далее» листают презентацию (с пошаговыми появлениями).":"Откройте урок dbms.html в другой вкладке этого же браузера — страницы свяжутся сами. На телефоне листайте сценарий кнопками.";}
if(bc){bc.onmessage=e=>{const d=e.data||{};if(d.t==="slide"){linked=true;deckN=d.n;if(d.total)total=Math.min(d.total,S.length);view=Math.min(d.n-1,S.length-1);setConn();drawCur();}};send({cmd:"ping"});setInterval(()=>{if(!linked)send({cmd:"ping"});},2000);}
$("#next").onclick=()=>{if(linked)send({cmd:"next"});else{view=Math.min(S.length-1,view+1);drawCur();}};
$("#prev").onclick=()=>{if(linked)send({cmd:"prev"});else{view=Math.max(0,view-1);drawCur();}};
addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();$("#next").click();}if(e.key==="ArrowLeft"){e.preventDefault();$("#prev").click();}});
/* ===== таймер и шрифт ===== */
let t0=null,acc=0,iv=null;
const tfmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(Math.floor(s%60)).padStart(2,"0");
function tick(){const s=acc+(t0?(Date.now()-t0)/1000:0);const el=$("#timer");el.textContent=`⏱ ${tfmt(s)} / ${PLAN}:00`;el.style.color=s>PLAN*60?"#ff8a7a":"#ffd38a";}
$("#timer").onclick=()=>{if(t0){acc+=(Date.now()-t0)/1000;t0=null;clearInterval(iv);}else{t0=Date.now();iv=setInterval(tick,1000);}tick();};
let fs=18;try{fs=+localStorage.getItem("dbms-teacher-fs")||18;}catch(e){}
const setFs=()=>{document.documentElement.style.setProperty("--fs",fs+"px");try{localStorage.setItem("dbms-teacher-fs",fs);}catch(e){}};
$("#fsp").onclick=()=>{fs=Math.min(28,fs+2);setFs();};$("#fsm").onclick=()=>{fs=Math.max(14,fs-2);setFs();};
$("#print").onclick=()=>{document.querySelectorAll(".all details").forEach(d=>d.open=true);window.print();};
setFs();drawAll();drawCur();setConn();tick();
</script>
</body>
</html>
