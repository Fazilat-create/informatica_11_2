<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Информатика · 11 класс — уроки и домашние задания</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=PT+Serif:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Nunito","Segoe UI",Arial,sans-serif;background:#fbf3e6;color:#1d2346;line-height:1.5;min-height:100vh;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;width:520px;height:420px;border-radius:50%;background:#f9e4c8;left:-260px;top:-230px;z-index:0}
body::after{content:"";position:fixed;width:480px;height:360px;border-radius:50%;background:#f9e4c8;right:-240px;bottom:-230px;z-index:0}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:40px 18px 60px}
.tag{display:inline-block;background:#f58a27;color:#fff;font-weight:800;font-size:15px;padding:5px 14px 6px;border-radius:14px 14px 14px 4px}
h1{font-family:"PT Serif",Georgia,serif;font-size:clamp(30px,6vw,48px);line-height:1.08;margin:14px 0 8px}
.lead{font-size:18px;color:#6b5a4a;max-width:640px}
.sec{font-family:"PT Serif",Georgia,serif;font-size:24px;margin:34px 0 4px}
.sec small{font-family:"Nunito",sans-serif;font-size:15px;color:#8a6a4a;font-weight:700;margin-left:8px}
.list{display:grid;gap:14px;margin-top:14px}
.topic{background:#fffaf3;border:2px solid #f6c597;border-radius:24px;padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}
.n{width:46px;height:46px;border-radius:50%;background:#f58a27;color:#fff;font-weight:800;font-size:20px;display:grid;place-items:center}
.topic h3{font-size:20px;font-weight:800;line-height:1.25}
.topic p{color:#6b5a4a;font-size:16px;margin-top:4px}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:800;font-size:16px;border-radius:14px;padding:10px 16px;min-height:44px}
.btn.l{background:#1d2346;color:#fff}
.btn.h{background:#f58a27;color:#fff}
.btn.p{background:#fff;color:#1d2346;border:2px solid #f1d6b6}
.topic.soon{background:#fdf7ee;border-style:dashed;border-color:#ecd2b4}
.topic.soon .n{background:#ecd2b4;color:#8a6a4a}
.badge{display:inline-block;font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:3px}
.badge.now{background:#eaf6e3;color:#2f7d32}
.badge.soon{background:#f6e2c9;color:#8a6a4a}
.foot{margin-top:34px;color:#8a6a4a;font-size:14px}
@media (max-width:520px){.topic{grid-template-columns:1fr}.n{width:38px;height:38px;font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">🗄️ Информатика · 11 класс</span>
  <h1>Уроки и домашние задания</h1>
  <p class="lead">Здесь собраны все темы: презентации к урокам и домашние задания. Новые темы появляются по мере прохождения.</p>

  <div id="root"></div>
  <p class="foot">Домашнее задание открывай в обычном браузере (Chrome, Safari, Яндекс), а не внутри мессенджера — так ответы не потеряются.</p>
</div>

<script>
/* ===== СПИСОК ТЕМ =====
   Чтобы добавить тему — допиши объект в нужный раздел.
   status: "now" — текущая тема, "done" — пройдена, "soon" — скоро.
   lesson / hw / practice — пути к HTML-файлам в этом же репозитории.
   Пустая строка = кнопки нет.
   Примеры путей:
     "db-model.html"            — файл рядом с index.html
     "topics/db-model.html"     — файл в подпапке
     "db-model.html#dz"         — якорь внутри файла
*/
const SECTIONS=[
  {title:"Базы данных",note:"глава 1",topics:[
    {title:"База данных — модель предметной области",desc:"Предметная область, запись, поле, ключ, связи таблиц. Мини-версия задания 3 из ЕГЭ.",status:"now",
     lesson:"db-model.html",
     hw:"db-model.html#dz"},
    {title:"Системы управления базами данных (СУБД)",desc:"Кто ищет среди миллиона строк за долю секунды.",status:"soon"}
  ]}
];

const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let k=0;
document.getElementById("root").innerHTML=SECTIONS.map(s=>`<h2 class="sec">${esc(s.title)}${s.note?`<small>${esc(s.note)}</small>`:""}</h2><div class="list">`+
  s.topics.map(t=>{k++;const soon=t.status==="soon";
    const b=[t.lesson&&`<a class="btn l" href="${esc(t.lesson)}" target="_blank" rel="noopener">📽️ Урок</a>`,
             t.hw&&`<a class="btn h" href="${esc(t.hw)}" target="_blank" rel="noopener">📝 Домашка</a>`,
             t.practice&&`<a class="btn p" href="${esc(t.practice)}" target="_blank" rel="noopener">💻 Практика</a>`].filter(Boolean).join("");
    return `<div class="topic ${soon?"soon":""}"><div class="n">${k}</div><div><h3>${esc(t.title)}${t.status==="now"?'<span class="badge now">сейчас</span>':soon?'<span class="badge soon">скоро</span>':""}</h3>${t.desc?`<p>${esc(t.desc)}</p>`:""}${b?`<div class="btns">${b}</div>`:""}</div></div>`;}).join("")+"</div>").join("");
</script>
</body>
</html>
